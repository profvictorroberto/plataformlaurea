<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Plataforma Láurea SESI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header { background: #0d6efd; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .menu { display: flex; gap: 10px; background: #fff; padding: 10px 20px; border-bottom: 1px solid #ccc; }
        .menu button { background: none; border: none; font-size: 16px; cursor: pointer; padding: 8px 15px; border-radius: 5px; color: #555; }
        .menu button:hover { background: #e9ecef; }
        .menu button.active { background: #0d6efd; color: white; font-weight: bold; }
        
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-primary { background-color: #0d6efd; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-primary:hover { background-color: #0b5ed7; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
        
        .btn-sm { padding: 5px 10px; font-size: 12px; cursor: pointer; border: none; border-radius: 3px; color: white; }
        .btn-edit { background: #ffc107; color: black; }
        .btn-del { background: #dc3545; }
        
        .btn-vote { width: 50px; padding: 8px; font-size: 14px; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-up { background-color: #198754; }
        .btn-down { background-color: #dc3545; }
        
        .competencia-row { border-bottom: 1px dashed #ccc; padding: 10px 0; display: flex; flex-direction: column; gap: 10px; }
        .votacao-acoes { display: flex; gap: 10px; align-items: center; }
        .obs-input { flex-grow: 1; padding: 8px; font-size: 13px; }
        
        .historico-votos { background: #eef2f5; padding: 8px; border-radius: 5px; font-size: 12px; color: #444; margin-top: 5px; }
        .badge { display: inline-block; padding: 3px 6px; border-radius: 3px; background: #6c757d; color: white; font-size: 11px; margin-right: 5px; }
        .badge-up { background: #198754; }
        .badge-down { background: #dc3545; }
        .ranking-box { background: #fff3cd; padding: 15px; border-radius: 8px; border: 1px solid #ffe69c; margin-bottom: 15px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

<div class="container" id="tela-login">
    <h2 style="text-align: center; color: #0d6efd;">Plataforma Láurea SESI</h2>
    <input type="email" id="email" placeholder="E-mail do Professor" style="width: 100%;">
    <input type="password" id="senha" placeholder="Senha" style="width: 100%;">
    <button class="btn-primary" onclick="login()">Entrar</button>
</div>

<div id="tela-app" style="display:none;">
    <div class="header">
        <h3 style="margin: 0;">Plataforma Láurea SESI</h3>
        <div>
            <span id="nome-prof" style="margin-right: 15px; font-size: 14px;"></span>
            <button onclick="sair()" class="btn-sm" style="background: #343a40;">Sair</button>
        </div>
    </div>

    <div class="menu">
        <button id="tab-btn-votacao" class="active" onclick="mudarAba('votacao')">Votação & Pódios</button>
        <button id="tab-btn-turmas" onclick="mudarAba('turmas')">Gerenciar Turmas</button>
        <button id="tab-btn-alunos" onclick="mudarAba('alunos')">Gerenciar Alunos</button>
    </div>

    <!-- ABA 1: VOTAÇÃO -->
    <div id="aba-votacao" class="container aba-conteudo">
        <div class="grid-2">
            <div>
                <h3>Painel de Votação</h3>
                <select id="filtro-turma-votacao" style="width: 100%; margin-bottom: 15px;" onchange="carregarAlunosParaVotacao()">
                    <option value="">-- Selecione uma Turma --</option>
                </select>
                <div id="lista-votacao"><p style="color: #666;">Selecione uma turma acima.</p></div>
            </div>
            <div>
                <h3>Pódios Oficiais (Top 3)</h3>
                <div id="rankings"></div>
            </div>
        </div>
    </div>

    <!-- ABA 2: TURMAS -->
    <div id="aba-turmas" class="container aba-conteudo" style="display: none;">
        <h3>Criar Nova Turma</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="nomeNovaTurma" placeholder="Ex: 6º Ano A" style="flex-grow: 1;">
            <select id="serieNovaTurma" style="width: 150px;">
                <option value="6">6º Ano</option>
                <option value="7">7º Ano</option>
                <option value="8">8º Ano</option>
                <option value="9">9º Ano</option>
            </select>
            <button class="btn-primary" style="width: auto; padding: 0 20px;" onclick="salvarTurma()">Criar Turma</button>
        </div>
        <div id="lista-turmas-admin"></div>
    </div>

    <!-- ABA 3: ALUNOS -->
    <div id="aba-alunos" class="container aba-conteudo" style="display: none;">
        <h3>Cadastrar / Gerenciar Alunos</h3>
        <div class="card" style="display: flex; flex-wrap: wrap; gap: 10px;">
            <select id="select-turma-cadastro" style="flex-grow: 1; min-width: 200px;" onchange="carregarAlunosAdmin()">
                <option value="">-- Escolha a Turma --</option>
            </select>
            <input type="text" id="nomeNovoAluno" placeholder="Nome do Aluno" style="flex-grow: 2; min-width: 200px;">
            <input type="number" id="mediaNovoAluno" placeholder="Média Atual (Ex: 8.5)" step="0.1" style="width: 150px;">
            <button class="btn-primary" style="width: auto; padding: 0 20px;" onclick="salvarAluno()">Adicionar Aluno</button>
        </div>
        <div id="lista-alunos-admin"><p style="color: #666;">Selecione uma turma acima.</p></div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO REAL DO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyB3YT9ThbQAL79MvXWLWkwn7wnRy7QmwWg",
        authDomain: "laureasesi.firebaseapp.com",
        projectId: "laureasesi",
        storageBucket: "laureasesi.firebasestorage.app",
        messagingSenderId: "323875516520",
        appId: "1:323875516520:web:4c2eec01ccaafa23b04bdd"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let professorLogado = "";
    let listaDeTurmas = [];

    // 1. LOGIN E NAVEGAÇÃO
    function login() {
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        auth.signInWithEmailAndPassword(email, senha).then((cred) => {
            professorLogado = cred.user.email;
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-app').style.display = 'block';
            document.getElementById('nome-prof').innerText = "Prof: " + professorLogado;
            iniciarSistema();
        }).catch(err => alert("Erro ao logar."));
    }

    function sair() { auth.signOut().then(() => location.reload()); }

    function mudarAba(abaId) {
        document.querySelectorAll('.aba-conteudo').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.menu button').forEach(el => el.classList.remove('active'));
        document.getElementById(`aba-${abaId}`).style.display = 'block';
        document.getElementById(`tab-btn-${abaId}`).classList.add('active');
    }

    function iniciarSistema() {
        carregarTurmas();
        iniciarRankings();
    }

    // 2. LÓGICA DE TURMAS (Ordenação feita no JS para evitar erro de Index no Firebase)
    function carregarTurmas() {
        db.collection("turmas").onSnapshot(snapshot => {
            let turmasTemp = [];
            snapshot.forEach(doc => turmasTemp.push({ id: doc.id, ...doc.data() }));

            // Ordena as turmas por série e depois ordem alfabética localmente
            turmasTemp.sort((a, b) => {
                if (a.serie === b.serie) return a.nome.localeCompare(b.nome);
                return a.serie - b.serie;
            });

            listaDeTurmas = turmasTemp;
            let optionsDropdown = `<option value="">-- Selecione uma Turma --</option>`;
            let htmlAdmin = "";

            listaDeTurmas.forEach(t => {
                optionsDropdown += `<option value="${t.id}">${t.nome} (${t.serie}º Ano)</option>`;
                htmlAdmin += `
                    <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 10px;">
                        <span><strong>${t.nome}</strong> - ${t.serie}º Ano</span>
                        <div>
                            <button class="btn-sm btn-edit" onclick="editarTurma('${t.id}', '${t.nome}')">Editar</button>
                            <button class="btn-sm btn-del" onclick="excluirTurma('${t.id}')">Apagar</button>
                        </div>
                    </div>`;
            });

            document.getElementById('filtro-turma-votacao').innerHTML = optionsDropdown;
            document.getElementById('select-turma-cadastro').innerHTML = optionsDropdown;
            document.getElementById('lista-turmas-admin').innerHTML = htmlAdmin || "<p>Nenhuma turma criada.</p>";
        });
    }

    function salvarTurma() {
        const nome = document.getElementById('nomeNovaTurma').value.trim();
        const serie = document.getElementById('serieNovaTurma').value;
        if (!nome) return alert("Digite o nome da turma!");

        db.collection("turmas").add({ nome, serie })
          .then(() => document.getElementById('nomeNovaTurma').value = "")
          .catch(err => alert("Erro ao salvar: " + err.message));
    }

    function editarTurma(id, nomeAtual) {
        const novoNome = prompt("Novo nome da turma:", nomeAtual);
        if (novoNome && novoNome.trim() !== "") db.collection("turmas").doc(id).update({ nome: novoNome });
    }

    function excluirTurma(id) {
        if (confirm("Apagar turma? Os alunos não serão apagados automaticamente, remova-os antes.")) {
            db.collection("turmas").doc(id).delete();
        }
    }

    // 3. LÓGICA DE ALUNOS (Ordenação local)
    function salvarAluno() {
        const turmaId = document.getElementById('select-turma-cadastro').value;
        const nome = document.getElementById('nomeNovoAluno').value.trim();
        const media = parseFloat(document.getElementById('mediaNovoAluno').value);

        if (!turmaId) return alert("Selecione uma turma primeiro!");
        if (!nome || isNaN(media)) return alert("Preencha o nome e a média!");

        const turmaObj = listaDeTurmas.find(t => t.id === turmaId);

        db.collection("alunos").add({
            nome: nome,
            turmaId: turmaId,
            serie: turmaObj.serie, 
            mediaInicial: media,
            mediaFinal: media,
            votosRegistrados: {}
        }).then(() => {
            document.getElementById('nomeNovoAluno').value = "";
            document.getElementById('mediaNovoAluno').value = "";
        }).catch(err => alert("Erro ao salvar aluno: " + err.message));
    }

    function carregarAlunosAdmin() {
        const turmaId = document.getElementById('select-turma-cadastro').value;
        const divAdmin = document.getElementById('lista-alunos-admin');
        if (!turmaId) { divAdmin.innerHTML = "<p>Selecione uma turma.</p>"; return; }

        db.collection("alunos").where("turmaId", "==", turmaId).onSnapshot(snapshot => {
            let alunosTemp = [];
            snapshot.forEach(doc => alunosTemp.push({ id: doc.id, ...doc.data() }));
            
            // Ordena alfabeticamente no JS
            alunosTemp.sort((a, b) => a.nome.localeCompare(b.nome));

            let html = "";
            alunosTemp.forEach(a => {
                html += `
                    <div class="card" style="display: flex; justify-content: space-between; padding: 10px;">
                        <span><strong>${a.nome}</strong> - Média: ${a.mediaFinal.toFixed(2)}</span>
                        <div>
                            <button class="btn-sm btn-edit" onclick="editarAluno('${a.id}', '${a.nome}', ${a.mediaFinal})">Editar</button>
                            <button class="btn-sm btn-del" onclick="excluirAluno('${a.id}')">Excluir</button>
                        </div>
                    </div>`;
            });
            divAdmin.innerHTML = html || "<p>Nenhum aluno nesta turma.</p>";
        });
    }

    function editarAluno(id, nomeAtual, mediaAtual) {
        const novoNome = prompt("Novo nome:", nomeAtual) || nomeAtual;
        const novaMediaStr = prompt("Alterar média final:", mediaAtual);
        if (novaMediaStr !== null) {
            const novaMedia = parseFloat(novaMediaStr);
            if (!isNaN(novaMedia)) db.collection("alunos").doc(id).update({ nome: novoNome, mediaFinal: novaMedia });
        }
    }

    function excluirAluno(id) {
        if (confirm("Apagar aluno permanentemente?")) db.collection("alunos").doc(id).delete();
    }

    // 4. LÓGICA DE VOTAÇÃO
    function carregarAlunosParaVotacao() {
        const turmaId = document.getElementById('filtro-turma-votacao').value;
        const divVotacao = document.getElementById('lista-votacao');
        if (!turmaId) { divVotacao.innerHTML = "<p>Selecione uma turma acima.</p>"; return; }

        db.collection("alunos").where("turmaId", "==", turmaId).onSnapshot(snapshot => {
            let alunosTemp = [];
            snapshot.forEach(doc => alunosTemp.push({ id: doc.id, ...doc.data() }));
            
            // Ordena alfabeticamente localmente
            alunosTemp.sort((a, b) => a.nome.localeCompare(b.nome));

            let html = "";
            alunosTemp.forEach(aluno => {
                const votos = aluno.votosRegistrados || {};
                
                const renderCompetencia = (compNome) => {
                    let logHtml = "";
                    let jaVotou = false;

                    for (let key in votos) {
                        if (votos[key].competencia === compNome) {
                            const v = votos[key];
                            const corBadge = v.valor > 0 ? 'badge-up' : 'badge-down';
                            const sinal = v.valor > 0 ? '+' : '';
                            logHtml += `<div><span class="badge ${corBadge}">${sinal}${v.valor}</span> <strong>${v.prof}</strong>: <em>${v.obs || 'Sem obs'}</em></div>`;
                            if (v.prof === professorLogado) jaVotou = true;
                        }
                    }

                    if (logHtml === "") logHtml = "<em>Nenhum voto.</em>";

                    let interfaceVoto = jaVotou 
                        ? `<div style="color: #198754; font-weight: bold; font-size: 13px;">✅ Você já votou nesta competência!</div>`
                        : `<div class="votacao-acoes">
                                <input type="text" id="obs-${aluno.id}-${compNome}" class="obs-input" placeholder="Justificativa (Opcional)">
                                <button class="btn-vote btn-up" onclick="votar('${aluno.id}', '${compNome}', 0.5, 'obs-${aluno.id}-${compNome}')">+0,5</button>
                                <button class="btn-vote btn-down" onclick="votar('${aluno.id}', '${compNome}', -0.5, 'obs-${aluno.id}-${compNome}')">-0,5</button>
                           </div>`;

                    return `
                        <div class="competencia-row">
                            <div><strong>${compNome}</strong><div class="historico-votos">${logHtml}</div></div>
                            ${interfaceVoto}
                        </div>`;
                };

                html += `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 10px;">
                            <strong style="font-size: 18px;">${aluno.nome}</strong>
                            <span style="font-size: 18px;">Média: <strong style="color: #0d6efd;">${aluno.mediaFinal.toFixed(2)}</strong></span>
                        </div>
                        ${renderCompetencia('Comportamento')}
                        ${renderCompetencia('Participação')}
                        ${renderCompetencia('Frequência')}
                    </div>`;
            });
            divVotacao.innerHTML = html || "<p>Nenhum aluno nesta turma.</p>";
        });
    }

    async function votar(alunoId, competencia, valor, inputId) {
        const obs = document.getElementById(inputId).value.trim();
        const ref = db.collection('alunos').doc(alunoId);
        const profKey = professorLogado.replace(/[\.\#\$\[\]]/g, '_');
        const votoKey = `${profKey}_${competencia}`;

        try {
            await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(ref);
                let dados = doc.data();
                if ((dados.votosRegistrados || {})[votoKey]) throw "Você já votou aqui!";
                
                let novaMedia = dados.mediaFinal + valor;
                if (novaMedia > 10) novaMedia = 10;
                if (novaMedia < 0) novaMedia = 0;

                transaction.set(ref, {
                    mediaFinal: novaMedia,
                    votosRegistrados: {
                        [votoKey]: { valor, obs, prof: professorLogado, competencia, data: new Date().toISOString() }
                    }
                }, { merge: true });
            });
        } catch (err) { alert(err); }
    }

    // 5. RANKINGS (Ordenação e corte local)
    function iniciarRankings() {
        const series = ['6', '7', '8', '9'];
        const divRankings = document.getElementById('rankings');
        
        series.forEach(serie => {
            let divSerie = document.createElement('div');
            divSerie.id = `ranking-${serie}`;
            divRankings.appendChild(divSerie);

            db.collection("alunos").where("serie", "==", serie).onSnapshot(snapshot => {
                let alunosTemp = [];
                snapshot.forEach(doc => alunosTemp.push(doc.data()));
                
                // Ordena do maior pro menor e pega apenas os 3 primeiros
                alunosTemp.sort((a, b) => b.mediaFinal - a.mediaFinal);
                let top3 = alunosTemp.slice(0, 3);

                let html = `<div class="ranking-box"><h4 style="margin-top:0; color:#856404;">Pódio - ${serie}º Ano</h4>`;
                
                if (top3.length === 0) {
                    html += `<p style="font-size: 13px; color: #666;">Aguardando alunos...</p>`;
                } else {
                    top3.forEach((a, index) => {
                        html += `<p style="margin: 5px 0;"><strong>${index + 1}º</strong> ${a.nome} - <span style="font-weight:bold; color:#d39e00;">Nota: ${a.mediaFinal.toFixed(2)}</span></p>`;
                    });
                }
                
                html += `</div>`;
                divSerie.innerHTML = html;
            });
        });
    }
</script>
</body>
</html>
